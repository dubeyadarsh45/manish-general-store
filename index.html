<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Midnight Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e1a;
    --bg-soft: #10162a;
    --card: #151c33;
    --card-hi: #1c2440;
    --line: #2a3352;
    --gold: #f4b740;
    --gold-dim: #caa25e;
    --violet: #8f7fe0;
    --text: #eceef7;
    --muted: #8c93ac;
    --green: #5fd694;
    --red: #f26d6d;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #1a2350 0%, var(--bg) 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold);color:#1a1300;}

  /* stars */
  #stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.5;animation:twinkle 4s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
  @media (prefers-reduced-motion: reduce){ .star{animation:none;opacity:.4} }

  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}

  /* header */
  header.site{
    position:sticky;top:0;z-index:40;
    background:rgba(10,14,26,.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .headrow{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:16px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:.2px;}
  .logo .moon{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--gold), var(--gold-dim) 70%);
    box-shadow:0 0 18px 2px rgba(244,183,64,.55);
    flex:none;
  }
  .logo small{display:block;font-family:'Inter';font-weight:500;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
  .nav-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

  .btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    padding:9px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    transition:.15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--gold-dim);background:var(--card-hi);}
  .btn-gold{background:linear-gradient(180deg,var(--gold),#d99b2b);color:#221a06;border:none;}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--line);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
  .btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .cart-btn{position:relative;}
  .badge{
    position:absolute;top:-8px;right:-8px;background:var(--gold);color:#221a06;
    font-size:11px;font-weight:800;border-radius:20px;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }

  /* hero */
  .hero{padding:46px 0 26px;position:relative;display:flex;align-items:center;justify-content:space-between;gap:40px;}
  .hero-left{flex:1;min-width:0;}
  .hero-right{flex:0 0 360px;display:flex;justify-content:center;align-items:center;}
  .hero-right img{width:100%;max-width:360px;height:360px;object-fit:cover;border-radius:18px;border:2px solid var(--gold);box-shadow:0 0 28px rgba(244,183,64,.35);display:block;}
  .hero h1{font-size:44px;margin:0 0 10px;line-height:1.08;font-weight:600;}
  .hero .accent{color:var(--gold);font-style:italic;}
  .hero p{color:var(--muted);font-size:15.5px;max-width:520px;margin:0 0 20px;}
  .hero-badges{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .pill{border:1px solid var(--line);border-radius:30px;padding:6px 14px;font-size:12.5px;color:var(--muted);background:var(--bg-soft);}
  @media(max-width:760px){
    .hero{flex-direction:column;align-items:stretch;gap:24px;}
    .hero-right{flex:0 0 auto;}
    .hero-right img{max-width:320px;height:320px;margin:0 auto;}
    .hero h1{font-size:36px;}
  }

  /* search + tabs */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0 22px;}
  .search{
    flex:1;min-width:220px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;color:var(--text);font-size:14px;
  }
  .search:focus{outline:2px solid var(--gold-dim);}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .tab{
    padding:8px 16px;border-radius:30px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font-size:13.5px;font-weight:600;
  }
  .tab.active{background:var(--gold);color:#221a06;border-color:var(--gold);}

  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-bottom:40px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;gap:8px;transition:.15s;
  }
  .card:hover{border-color:var(--gold-dim);transform:translateY(-2px);}
  .p-emoji{font-size:38px;line-height:1;}
  .p-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--violet);font-weight:700;}
  .p-name{font-weight:700;font-size:15px;}
  .p-desc{color:var(--muted);font-size:12.5px;min-height:16px;}
  .p-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
  .p-price{font-weight:800;font-size:16px;}
  .p-mrp{color:var(--muted);font-size:12px;text-decoration:line-through;margin-left:6px;}
  .stock-low{color:var(--red);font-size:11px;font-weight:700;}
  .stock-out{color:var(--muted);font-size:11px;font-weight:700;}
  .qty-row{display:flex;align-items:center;gap:8px;}
  .qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg-soft);color:var(--text);font-weight:700;}

  /* footer */
  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:12.5px;text-align:center;}

  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(4,6,14,.6);z-index:60;display:none;}
  .overlay.show{display:block;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:min(420px,92vw);
    background:var(--bg-soft);border-left:1px solid var(--line);
    z-index:70;transform:translateX(100%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
  .drawer-foot{padding:16px 20px;border-top:1px solid var(--line);}
  .cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .cart-item .em{font-size:26px;}
  .cart-item .info{flex:1;}
  .cart-item .name{font-weight:600;font-size:13.5px;}
  .cart-item .sub{color:var(--muted);font-size:12px;}
  .sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--muted);}
  .sum-row.total{color:var(--text);font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
  .coupon-row{display:flex;gap:8px;margin:10px 0;}
  .coupon-row input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;}

  /* modal */
  .modal{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:var(--bg-soft);border:1px solid var(--line);border-radius:16px;
    z-index:80;width:min(440px,92vw);max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;
  }
  .modal.show{display:block;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal-body{padding:20px 22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;color:var(--text);font-size:14px;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold-dim);}
  .pay-options{display:flex;gap:8px;flex-wrap:wrap;}
  .pay-opt{flex:1;min-width:100px;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:700;background:var(--card);}
  .pay-opt.active{border-color:var(--gold);background:rgba(244,183,64,.12);color:var(--gold);}
  .err{color:var(--red);font-size:12.5px;margin-top:-6px;margin-bottom:10px;min-height:14px;}
  .link-btn{background:none;border:none;color:var(--gold);font-weight:700;font-size:13px;padding:0;}

  /* views/sections */
  .section-title{font-size:22px;margin:0 0 4px;}
  .section-sub{color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  .hidden{display:none !important;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .stat-card .num{font-size:24px;font-weight:800;font-family:'Fraunces',serif;}
  .stat-card .lbl{color:var(--muted);font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;}
  .table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin-bottom:26px;}
  select.status-select{background:var(--bg-soft);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 8px;font-size:12.5px;}
  .status-tag{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .st-pending{background:rgba(244,183,64,.15);color:var(--gold);}
  .st-packed{background:rgba(143,127,224,.18);color:var(--violet);}
  .st-out{background:rgba(95,214,148,.12);color:var(--green);}
  .st-delivered{background:rgba(95,214,148,.22);color:var(--green);}
  .st-cancelled{background:rgba(242,109,109,.16);color:var(--red);}

  .tab-strip{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .tab-strip button{background:none;border:none;color:var(--muted);padding:10px 4px;font-weight:700;font-size:13.5px;border-bottom:2px solid transparent;}
  .tab-strip button.active{color:var(--gold);border-color:var(--gold);}

  .order-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .order-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .order-id{font-weight:700;font-size:14px;}
  .order-items{color:var(--muted);font-size:13px;margin:6px 0;}
  .invoice{background:#fff;color:#1a1a2a;border-radius:10px;padding:24px;font-family:'Inter',sans-serif;}
  .invoice h2{font-family:'Fraunces',serif;margin:0 0 2px;}
  .invoice table{font-size:13px;}
  .invoice th,.invoice td{border-bottom:1px solid #ddd;color:#1a1a2a;}
  .invoice .tot{font-weight:800;font-size:16px;}
  .empty{text-align:center;color:var(--muted);padding:50px 10px;}
  .empty .big{font-size:40px;margin-bottom:10px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--gold-dim);color:var(--text);
    padding:12px 20px;border-radius:10px;z-index:100;font-size:13.5px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .prod-admin-row{display:flex;gap:10px;align-items:center;}

  /* ---------------- strict one-page A4 invoice printing ---------------- */
  @page { size: A4 portrait; margin: 0; }
  @media print {
    /* Remove every other page-producing element from the print layout.
       visibility:hidden is intentionally NOT used because it still occupies space. */
    html, body {
      width: 210mm !important;
      min-width: 210mm !important;
      height: auto !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
      color: #111 !important;
      overflow: hidden !important;
    }
    body > * { display: none !important; }
    body > #modalRoot {
      display: block !important;
      position: static !important;
      width: 210mm !important;
      max-width: 210mm !important;
      height: auto !important;
      max-height: none !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      transform: none !important;
      overflow: visible !important;
      background: #fff !important;
      box-shadow: none !important;
    }
    #modalRoot .modal-head,
    #modalRoot .btn,
    #modalRoot .modal-body > button,
    #overlay { display: none !important; }
    #modalRoot .modal-body {
      display: block !important;
      width: 210mm !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #invoiceEl {
      display: block !important;
      width: 190mm !important;
      max-width: 190mm !important;
      min-width: 0 !important;
      height: auto !important;
      max-height: 277mm !important;
      min-height: 0 !important;
      margin: 0 auto !important;
      padding: 8mm !important;
      box-sizing: border-box !important;
      border: 1px solid #222 !important;
      border-radius: 0 !important;
      background: #fff !important;
      color: #111 !important;
      font-size: 10pt !important;
      line-height: 1.25 !important;
      box-shadow: none !important;
      overflow: hidden !important;
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }
    #invoiceEl h2 {
      font-size: 20pt !important;
      margin: 0 0 2mm !important;
    }
    #invoiceEl table {
      width: 100% !important;
      border-collapse: collapse !important;
      font-size: 9pt !important;
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }
    #invoiceEl th, #invoiceEl td {
      padding: 1.5mm 1mm !important;
      color: #111 !important;
      break-inside: avoid !important;
    }
    #invoiceEl > div { margin-bottom: 2.5mm !important; }
    #invoiceEl .tot { font-size: 12pt !important; }
  }
</style>
</head>

<script>
/* ---------------- storage helpers ---------------- */
async function sget(key, fallback){
  try{
    const raw = localStorage.getItem('midnight_store_' + key);
    return raw === null ? fallback : JSON.parse(raw);
  }catch(e){ console.error('localStorage get failed', key, e); return fallback; }
}
async function sset(key, value){
  try{ localStorage.setItem('midnight_store_' + key, JSON.stringify(value)); }
  catch(e){ console.error('localStorage set failed', key, e); }
}

/* ---------------- client-side token session ----------------
   This keeps the user logged in after refresh on the same browser.
   It is persistence, not server-side security; sensitive production auth
   should use a real backend. */
const SESSION_KEY = 'midnight_store_auth_token';
function createAuthToken(username, isAdmin){
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  const token = Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
  localStorage.setItem(SESSION_KEY, JSON.stringify({token, username, isAdmin:!!isAdmin, createdAt:Date.now()}));
  return token;
}
function restoreAuthToken(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || !data.token || !data.username) return null;
    return {username:data.username, isAdmin:!!data.isAdmin, token:data.token};
  }catch(e){ return null; }
}
function clearAuthToken(){ localStorage.removeItem(SESSION_KEY); }

/* ---------------- boot ---------------- */
const CATALOG_VERSION = 2;
async function boot(){
  makeStars();
  PRODUCTS = await sget('products', null);
  const version = await sget('catalog_version', 1);
  if(!PRODUCTS){
    PRODUCTS = seedProducts();
    await sset('products', PRODUCTS);
    await sset('catalog_version', CATALOG_VERSION);
  } else if(version < CATALOG_VERSION){
    const fresh = seedProducts();
    const existingIds = new Set(PRODUCTS.map(p=>p.id));
    const newOnes = fresh.filter(p=>!existingIds.has(p.id));
    // also update category renames on already-existing items (old General -> new categories)
    PRODUCTS.forEach(p=>{
      const match = fresh.find(f=>f.id===p.id);
      if(match) p.category = match.category;
    });
    PRODUCTS = PRODUCTS.concat(newOnes);
    await sset('products', PRODUCTS);
    await sset('catalog_version', CATALOG_VERSION);
  }
  ACCOUNTS = await sget('accounts', {});
  ORDERS = await sget('orders', []);
  CARTS = await sget('carts', {});
  const savedSession = restoreAuthToken();
  if(savedSession){
    if(savedSession.isAdmin && savedSession.username === 'admin') session = savedSession;
    else if(!savedSession.isAdmin && ACCOUNTS[savedSession.username]) session = savedSession;
    else clearAuthToken();
  }
  render();
}
function makeStars(){
  const el = document.getElementById('stars');
  let html='';
  for(let i=0;i<60;i++){
    const x=Math.random()*100, y=Math.random()*60, d=Math.random()*4;
    html += `<div class="star" style="left:${x}%;top:${y}%;animation-delay:${d}s"></div>`;
  }
  el.innerHTML = html;
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2200);
}
function cart(){ return session ? (CARTS[session.username] || []) : []; }
function cartCount(){ return cart().reduce((a,i)=>a+i.qty,0); }
function money(n){ return '₹'+n.toLocaleString('en-IN', {maximumFractionDigits:0}); }

/* ---------------- billing logic ---------------- */
function billFor(cartItems, couponCode){
  const lines = cartItems.map(ci=>{
    const p = PRODUCTS.find(p=>p.id===ci.id);
    if(!p) return null;
    return {p, qty:ci.qty, lineTotal: p.price*ci.qty};
  }).filter(Boolean);
  const subtotal = lines.reduce((a,l)=>a+l.lineTotal,0);
  // GST: medicine 0%, grocery/general 5%
  const tax = lines.reduce((a,l)=> a + (l.p.category==='Medicine' ? 0 : l.lineTotal*0.05), 0);
  let discount = 0;
  const coupon = couponCode ? COUPONS[couponCode.trim().toUpperCase()] : null;
  if(coupon){
    discount = coupon.type==='pct' ? subtotal*coupon.val/100 : coupon.val;
  }
  const deliveryFee = subtotal >= 499 || subtotal===0 ? 0 : 40;
  const total = Math.max(0, subtotal + tax - discount + deliveryFee);
  const points = Math.floor(total/100);
  return {lines, subtotal, tax, discount, deliveryFee, total, points, couponApplied: !!coupon};
}

/* ---------------- render root ---------------- */
function render(){
  renderNav();
  if(!session){ renderShop(); return; }
  if(session.isAdmin){ renderAdmin(); return; }
  renderShop();
}

function renderNav(){
  const nav = document.getElementById('navActions');
  if(!session){
    nav.innerHTML = `<button class="btn" onclick="openAuth('login')">Log in</button>
      <button class="btn btn-gold" onclick="openAuth('signup')">Sign up</button>`;
    return;
  }
  if(session.isAdmin){
    nav.innerHTML = `<span class="pill">👑 Admin: ${session.username}</span>
      <button class="btn btn-ghost" onclick="logout()">Log out</button>`;
    return;
  }
  nav.innerHTML = `
    <span class="pill">✨ ${ACCOUNTS[session.username]?.points||0} pts</span>
    <button class="btn cart-btn btn-ghost" onclick="openCart()">🛒 Cart ${cartCount()?`<span class="badge">${cartCount()}</span>`:''}</button>
    <button class="btn btn-ghost" onclick="setMainView('orders')">📦 Orders</button>
    <button class="btn btn-ghost" onclick="logout()">Log out</button>`;
}

let mainViewMode = 'shop';
function setMainView(v){ mainViewMode = v; render2(); }
function render2(){ // sub-render without resetting nav focus loops
  if(mainViewMode==='orders') renderOrders(); else renderShop();
}
// override render to respect mainViewMode for logged in users
const _origRender = render;
render = function(){
  renderNav();
  if(session && session.isAdmin){ renderAdmin(); return; }
  if(session && mainViewMode==='orders'){ renderOrders(); return; }
  renderShop();
}

function renderGridOnly(){
  let products = PRODUCTS.filter(p=>{
    const matchCat = currentTab==='All' || p.category===currentTab;
    const matchSearch = !searchQ || p.name.toLowerCase().includes(searchQ.toLowerCase());
    return matchCat && matchSearch;
  });
  renderProductGrid(products);
}
function setTab(c){ currentTab=c; renderShop(); document.getElementById('searchInput').focus(); }

function renderProductGrid(products){
  const grid = document.getElementById('productGrid');
  if(products.length===0){ grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">🕯️</div>No items match. Try another search.</div>`; return; }
  grid.innerHTML = products.map(p=>{
    const inCart = cart().find(i=>i.id===p.id);
    const qty = inCart?inCart.qty:0;
    const stockNote = p.stock===0 ? `<div class="stock-out">Out of stock</div>` : (p.stock<=5?`<div class="stock-low">Only ${p.stock} left</div>`:'');
    return `<div class="card">
      <div class="p-emoji">${p.emoji}</div>
      <div class="p-cat">${p.category}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-desc">${p.desc||''}</div>
      ${stockNote}
      <div class="p-row">
        <div><span class="p-price">${money(p.price)}</span>${p.mrp>p.price?`<span class="p-mrp">${money(p.mrp)}</span>`:''}</div>
      </div>
      ${qty===0 ?
        `<button class="btn btn-gold" ${p.stock===0?'disabled':''} onclick="addToCart('${p.id}')">Add to cart</button>`
        : `<div class="qty-row">
            <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
            <span style="min-width:20px;text-align:center;font-weight:700">${qty}</span>
            <button class="qty-btn" ${qty>=p.stock?'disabled':''} onclick="changeQty('${p.id}',1)">+</button>
          </div>`}
    </div>`;
  }).join('');
}

async function requireLogin(){
  if(!session){ toast('Please log in to continue'); openAuth('login'); return false; }
  return true;
}
async function addToCart(id){
  if(!(await requireLogin())) return;
  const list = CARTS[session.username] || (CARTS[session.username]=[]);
  const item = list.find(i=>i.id===id);
  if(item) item.qty++; else list.push({id, qty:1});
  await sset('carts', CARTS);
  render(); if(document.getElementById('cartDrawer').classList.contains('show')) openCart();
  toast('Added to cart');
}
async function changeQty(id, delta){
  const list = CARTS[session.username] || [];
  const item = list.find(i=>i.id===id);
  if(!item) return;
  const p = PRODUCTS.find(p=>p.id===id);
  item.qty += delta;
  if(item.qty>p.stock) item.qty=p.stock;
  if(item.qty<=0){ CARTS[session.username] = list.filter(i=>i.id!==id); }
  await sset('carts', CARTS);
  render(); if(document.getElementById('cartDrawer').classList.contains('show')) openCart();
}

async function placeOrder(){
  const address = document.getElementById('ckAddress').value.trim();
  const phone = document.getElementById('ckPhone').value.trim();
  const err = document.getElementById('ckErr');
  if(!address || !phone){ err.textContent='Please fill address and phone number.'; return; }
  if(!/^\d{10}$/.test(phone)){ err.textContent='Enter a valid 10-digit phone number.'; return; }

  const bill = billFor(cart(), activeCoupon);
  // reduce stock
  bill.lines.forEach(l=>{ const p = PRODUCTS.find(p=>p.id===l.p.id); p.stock = Math.max(0, p.stock - l.qty); });
  await sset('products', PRODUCTS);

  const order = {
    id: uid('ORD-'),
    username: session.username,
    items: bill.lines.map(l=>({id:l.p.id, name:l.p.name, emoji:l.p.emoji, price:l.p.price, qty:l.qty})),
    subtotal: bill.subtotal, tax: Math.round(bill.tax), discount: Math.round(bill.discount),
    deliveryFee: bill.deliveryFee, total: Math.round(bill.total),
    coupon: activeCoupon||null, payment: checkoutPayment, status:'Pending',
    address, phone, createdAt: new Date().toISOString()
  };
  ORDERS.push(order);
  await sset('orders', ORDERS);

  const acc = ACCOUNTS[session.username];
  acc.points = (acc.points||0) + bill.points;
  acc.address = address; acc.phone = phone;
  await sset('accounts', ACCOUNTS);

  CARTS[session.username] = [];
  await sset('carts', CARTS);
  activeCoupon='';

  closeDrawers();
  showInvoice(order);
  render();
  toast('Order placed successfully!');
}

/* ---------------- reliable invoice printing ----------------
   Prints the invoice in a clean, standalone document instead of
   printing the whole application DOM. This avoids blank previews
   on browsers/mobile devices caused by modal/print CSS handling. */
function printInvoice(){
  const invoice = document.getElementById('invoiceEl');
  if(!invoice){
    toast('Invoice is not ready. Please try again.');
    return;
  }

  const printWindow = window.open('', '_blank', 'width=900,height=700');
  if(!printWindow){
    toast('Please allow pop-ups to print the invoice.');
    return;
  }

  const invoiceHTML = invoice.outerHTML;

  printWindow.document.open();
  printWindow.document.write(`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Midnight Store - Invoice</title>
<style>
  @page { size: A4 portrait; margin: 12mm; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #111;
    font-family: Inter, Arial, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    padding: 0;
  }

  .invoice {
    width: 100%;
    max-width: 186mm;
    margin: 0 auto;
    padding: 8mm;
    border: 1px solid #222;
    border-radius: 0;
    background: #fff;
    color: #111;
    font-family: Inter, Arial, sans-serif;
    font-size: 10pt;
    line-height: 1.25;
    box-shadow: none;
    overflow: hidden;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .invoice h2 {
    margin: 0 0 2mm;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20pt;
    color: #111;
  }

  .invoice table {
    width: 100%;
    border-collapse: collapse;
    font-size: 9pt;
    margin-top: 3mm;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .invoice th,
  .invoice td {
    text-align: left;
    padding: 1.5mm 1mm;
    border-bottom: 1px solid #ddd;
    color: #111;
    break-inside: avoid;
  }

  .invoice .tot {
    font-weight: 800;
    font-size: 12pt;
    border-top: 1px solid #222;
    margin-top: 2mm;
    padding-top: 2mm;
  }

  @media print {
    body { padding: 0; }
    .invoice {
      max-width: none;
      width: 100%;
    }
  }
</style>
</head>
<body>
${invoiceHTML}
<script>
  window.addEventListener('load', function(){
    setTimeout(function(){
      window.focus();
      window.print();
    }, 250);
  });

  window.onafterprint = function(){
    setTimeout(function(){
      window.close();
    }, 100);
  };
<\/script>
</body>
</html>`);
  printWindow.document.close();
}

  const modal = document.getElementById('modalRoot');

      <div class="err" id="authErr"></div>
      <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="submitAuth()">${isLogin?'Log in':'Sign up'}</button>
      <p style="text-align:center;margin-top:14px;font-size:13px;color:var(--muted)">
        ${isLogin?`New here? <button class="link-btn" onclick="authMode='signup';renderAuthModal()">Create an account</button>`
                  :`Already have an account? <button class="link-btn" onclick="authMode='login';renderAuthModal()">Log in</button>`}
      </p>

  `;

async function submitAuth(){
  const user = document.getElementById('authUser').value.trim();
  const pass = document.getElementById('authPass').value;
  const err = document.getElementById('authErr');
  if(!user || !pass){ err.textContent='Enter both username and password.'; return; }

  if(user===ADMIN_USER){
    if(pass!==ADMIN_PASS){ err.textContent='Incorrect admin password.'; return; }
    session = {username:'admin', isAdmin:true, token:createAuthToken('admin', true)};
    closeDrawers(); render(); toast('Welcome back, admin'); return;
  }

  if(authMode==='login'){
    const acc = ACCOUNTS[user];
    if(!acc || acc.password!==pass){ err.textContent='Invalid username or password.'; return; }
    session = {username:user, isAdmin:false, token:createAuthToken(user, false)};
  } else {
    const name = document.getElementById('authName').value.trim();
    if(!name){ err.textContent='Please enter your name.'; return; }
    if(ACCOUNTS[user]){ err.textContent='Username already taken.'; return; }
    ACCOUNTS[user] = {password:pass, name, phone:'', address:'', points:0, joined:new Date().toISOString()};
    await sset('accounts', ACCOUNTS);
    session = {username:user, isAdmin:false, token:createAuthToken(user, false)};
  }
  mainViewMode='shop';
  closeDrawers(); render(); toast(`Welcome, ${user}!`);
}
function logout(){ clearAuthToken(); session=null; mainViewMode='shop'; closeDrawers(); render(); }

async function saveProduct(id){
  const name = document.getElementById('pfName').value.trim();
  const price = parseFloat(document.getElementById('pfPrice').value);
  const mrp = parseFloat(document.getElementById('pfMrp').value) || price;
  const stock = parseInt(document.getElementById('pfStock').value);
  const err = document.getElementById('pfErr');
  if(!name || isNaN(price) || isNaN(stock)){ err.textContent='Please fill name, price and stock correctly.'; return; }
  const data = {
    name, category: document.getElementById('pfCat').value,
    emoji: document.getElementById('pfEmoji').value || '🛍️',
    price, mrp, stock, unit: document.getElementById('pfUnit').value || 'pc',
    desc: document.getElementById('pfDesc').value
  };
  if(id){ Object.assign(PRODUCTS.find(p=>p.id===id), data); }
  else { PRODUCTS.push({id: uid('p'), ...data}); }
  await sset('products', PRODUCTS);
  closeDrawers(); renderAdmin(); toast('Product saved');
}

  PRODUCTS = PRODUCTS.filter(p=>p.id!==id);

  renderAdmin(); toast('Product removed');
}

    <div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
    <tbody>${filtered.slice().reverse().map(o=>`<tr>
      <td>${o.id}<br><span style="color:var(--muted);font-size:11px">${new Date(o.createdAt).toLocaleDateString('en-IN')}</span></td>
      <td>${o.username}</td>
      <td style="max-width:220px">${o.items.map(i=>`${i.name}×${i.qty}`).join(', ')}</td>
      <td>${money(o.total)}</td>
      <td><select class="status-select" onchange="updateOrderStatus('${o.id}', this.value)">
        ${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
      </select></td>
    </tr>`).join('')}</tbody></table></div>
    ${filtered.length===0?'<div class="empty">No orders in this filter.</div>':''}
  `;
}
function setOrdersFilter(f){ ordersFilter=f; renderAdmin(); }
async function updateOrderStatus(id, status){
  const o = ORDERS.find(o=>o.id===id); o.status = status;
  await sset('orders', ORDERS);
  toast('Order status updated');
}

function renderAdminUsers(){
  const body = document.getElementById('adminBody');
  const rows = Object.entries(ACCOUNTS);
  body.innerHTML = `
    <div class="table-wrap"><table><thead><tr><th>Username</th><th>Name</th><th>Phone</th><th>Points</th><th>Orders</th><th>Joined</th></tr></thead>
    <tbody>${rows.map(([u,a])=>`<tr>
      <td>${u}</td><td>${a.name}</td><td>${a.phone||'—'}</td><td>${a.points||0}</td>
      <td>${ORDERS.filter(o=>o.username===u).length}</td>
      <td>${a.joined?new Date(a.joined).toLocaleDateString('en-IN'):'—'}</td>
    </tr>`).join('')}</tbody></table></div>
    ${rows.length===0?'<div class="empty">No registered customers yet.</div>':''}
  `;
}

boot();
</script>
</body>
</html>
